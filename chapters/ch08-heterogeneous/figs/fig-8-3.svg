<svg viewBox="0 0 900 470" width="900" height="470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Backend 配置转换为编译选项与实际 buffer 的运行时链路">
  <defs>
    <style>text{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.title{fill:var(--fig-text,#1f2328);font-size:16px;font-weight:700}.lane{fill:var(--fig-bg,#fff);stroke:var(--fig-border,#d0d7de);stroke-width:1.4}.cfg{fill:var(--fig-surface,#f6f8fa);stroke:var(--fig-border,#d0d7de);stroke-width:1.4}.cpu{fill:var(--fig-surface-2,#eef1f5);stroke:var(--fig-text-soft,#57606a);stroke-width:1.5}.gpu{fill:var(--fig-accent-soft,#e8f0fe);stroke:var(--fig-accent,#0b57d0);stroke-width:1.6}.npu{fill:var(--fig-accent-2-soft,#f2ecff);stroke:var(--fig-accent-2,#6639ba);stroke-width:1.6}.t{fill:var(--fig-text,#1f2328);font-size:12px;font-weight:700}.ts{fill:var(--fig-text-soft,#57606a);font-size:10.5px}.td{fill:var(--fig-text-dim,#8b949e);font-size:10px}.edge{stroke:var(--fig-text-soft,#57606a);stroke-width:1.5;fill:none}.eg{stroke:var(--fig-accent,#0b57d0);stroke-width:1.6;fill:none}.en{stroke:var(--fig-accent-2,#6639ba);stroke-width:1.6;fill:none}.note{fill:var(--fig-surface,#f6f8fa);stroke:var(--fig-border-2,#e6eaef);stroke-width:1.2}</style>
    <marker id="a83" orient="auto" markerWidth="8" markerHeight="8" refX="7" refY="3.5"><path d="M0,0 L7,3.5 L0,7 z" fill="var(--fig-text-soft,#57606a)"/></marker>
    <marker id="a83g" orient="auto" markerWidth="8" markerHeight="8" refX="7" refY="3.5"><path d="M0,0 L7,3.5 L0,7 z" fill="var(--fig-accent,#0b57d0)"/></marker>
    <marker id="a83n" orient="auto" markerWidth="8" markerHeight="8" refX="7" refY="3.5"><path d="M0,0 L7,3.5 L0,7 z" fill="var(--fig-accent-2,#6639ba)"/></marker>
  </defs>
  <text class="title" x="450" y="27" text-anchor="middle">从 Backend 配置到实际执行与 buffer</text>
  <rect class="cfg" x="24" y="55" width="152" height="92" rx="8"/>
  <text class="t" x="100" y="81" text-anchor="middle">入口配置</text>
  <text class="ts" x="100" y="103" text-anchor="middle">--backend</text>
  <text class="ts" x="100" y="121" text-anchor="middle">LlmExecutorSettings</text>
  <path class="edge" d="M176,101 H210" marker-end="url(#a83)"/>
  <rect class="cfg" x="214" y="55" width="154" height="92" rx="8"/>
  <text class="t" x="291" y="81" text-anchor="middle">执行器工厂</text>
  <text class="ts" x="291" y="103" text-anchor="middle">CPU / GPU 共用实现</text>
  <text class="ts" x="291" y="121" text-anchor="middle">NPU 按辅助段选择</text>
  <text class="td" x="492" y="49" text-anchor="middle">编译选项</text>
  <text class="td" x="713" y="49" text-anchor="middle">compiled model 与 buffer</text>
  <rect class="lane" x="390" y="61" width="486" height="94" rx="8"/>
  <rect class="cpu" x="410" y="78" width="164" height="58" rx="7"/>
  <text class="t" x="492" y="100" text-anchor="middle">CPU: kCpu</text>
  <text class="ts" x="492" y="120" text-anchor="middle">线程数 · XNNPack cache</text>
  <path class="edge" d="M574,107 H610" marker-end="url(#a83)"/>
  <rect class="cpu" x="614" y="78" width="236" height="58" rx="7"/>
  <text class="t" x="732" y="100" text-anchor="middle">CPU CompiledModel</text>
  <text class="ts" x="732" y="120" text-anchor="middle">KV 可采用 single buffer</text>
  <rect class="lane" x="390" y="174" width="486" height="112" rx="8"/>
  <rect class="gpu" x="410" y="192" width="164" height="76" rx="7"/>
  <text class="t" x="492" y="214" text-anchor="middle">GPU: kGpu</text>
  <text class="ts" x="492" y="233" text-anchor="middle">FP16 / FP32</text>
  <text class="ts" x="492" y="251" text-anchor="middle">external tensor 规则</text>
  <path class="eg" d="M574,230 H610" marker-end="url(#a83g)"/>
  <rect class="gpu" x="614" y="192" width="236" height="76" rx="7"/>
  <text class="t" x="732" y="214" text-anchor="middle">GPU CompiledModel</text>
  <text class="ts" x="732" y="233" text-anchor="middle">KV / logits 可外部绑定</text>
  <text class="ts" x="732" y="251" text-anchor="middle">实际 storage 由 delegate 创建</text>
  <rect class="lane" x="390" y="305" width="486" height="112" rx="8"/>
  <rect class="npu" x="410" y="323" width="164" height="76" rx="7"/>
  <text class="t" x="492" y="345" text-anchor="middle">NPU: kNpu | kCpu</text>
  <text class="ts" x="492" y="365" text-anchor="middle">专用 / 通用执行器</text>
  <text class="ts" x="492" y="383" text-anchor="middle">取决于辅助模型段</text>
  <path class="en" d="M574,361 H610" marker-end="url(#a83n)"/>
  <rect class="npu" x="614" y="323" width="236" height="76" rx="7"/>
  <text class="t" x="732" y="345" text-anchor="middle">NPU 与 CPU 可共同执行</text>
  <text class="ts" x="732" y="365" text-anchor="middle">专用：embedder / 主模型 / auxiliary</text>
  <text class="ts" x="732" y="383" text-anchor="middle">通用：compiler plugin 分配子图</text>
  <path class="edge" d="M368,86 C382,86 384,107 390,107" marker-end="url(#a83)"/>
  <path class="eg" d="M368,101 C382,101 384,230 390,230" marker-end="url(#a83g)"/>
  <path class="en" d="M368,117 C382,117 384,361 390,361" marker-end="url(#a83n)"/>
  <rect class="note" x="88" y="339" width="250" height="70" rx="8"/>
  <text class="t" x="213" y="365" text-anchor="middle">Backend 不是驻留证明</text>
  <text class="ts" x="213" y="386" text-anchor="middle">还需检查 buffer 类型、布局、事件</text>
  <path class="edge" d="M338,374 H382" marker-end="url(#a83)"/>
  <text class="td" x="450" y="452" text-anchor="middle">同一 LlmExecutor 接口隐藏调用差异，不消除硬件与数据路径差异</text>
</svg>
