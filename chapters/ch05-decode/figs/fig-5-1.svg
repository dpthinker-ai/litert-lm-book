<svg viewBox="0 0 760 440" width="760" height="440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Decode 循环中取消检查、内部与外部采样、文本暂存、流式回调和停止判断的顺序">
  <defs>
    <style>
      text { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .box { fill: var(--fig-surface, #f6f8fa); stroke: var(--fig-border, #d0d7de); stroke-width: 1.5; }
      .hot { fill: var(--fig-bg, #ffffff); stroke: var(--fig-accent, #0b57d0); stroke-width: 1.8; }
      .kv { fill: var(--fig-surface-2, #eef1f5); stroke: var(--fig-border, #d0d7de); stroke-width: 1.5; }
      .t { fill: var(--fig-text, #1f2328); }
      .ts { fill: var(--fig-text-soft, #57606a); }
      .accent { fill: var(--fig-accent, #0b57d0); }
      .a2 { fill: var(--fig-accent-2, #6639ba); }
      .edge { stroke: var(--fig-text-soft, #57606a); stroke-width: 1.5; fill: none; }
      .loop { stroke: var(--fig-accent, #0b57d0); stroke-width: 2; fill: none; }
      .dot { fill: var(--fig-text-soft, #57606a); }
    </style>
    <marker id="a5" orient="auto" markerWidth="8" markerHeight="8" refX="6" refY="3.5">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fig-text-soft, #57606a)"/>
    </marker>
    <marker id="a5b" orient="auto" markerWidth="8" markerHeight="8" refX="6" refY="3.5">
      <path d="M0,0 L7,3.5 L0,7 z" fill="var(--fig-accent, #0b57d0)"/>
    </marker>
  </defs>
  <text class="t" x="380" y="25" text-anchor="middle" style="font-size:15px;font-weight:700">一次 decode 迭代的控制顺序</text>
  <rect class="hot" x="40" y="65" width="150" height="54" rx="6"/>
  <text class="accent" x="115" y="87" text-anchor="middle" style="font-size:12px;font-weight:700">迭代开始</text>
  <text class="ts" x="115" y="105" text-anchor="middle" style="font-size:10px">检查 cancelled；为真则取消</text>
  <rect class="box" x="250" y="65" width="160" height="54" rx="6"/>
  <text class="t" x="330" y="87" text-anchor="middle" style="font-size:12px;font-weight:700">模型前向</text>
  <text class="ts" x="330" y="105" text-anchor="middle" style="font-size:10px">执行 decode signature</text>
  <rect class="kv" x="250" y="140" width="160" height="36" rx="6"/>
  <text class="t" x="330" y="163" text-anchor="middle" style="font-size:11px">KV cache（读取并追加）</text>
  <rect class="hot" x="425" y="130" width="155" height="70" rx="6"/>
  <text class="accent" x="502" y="152" text-anchor="middle" style="font-size:11px;font-weight:700">内部采样</text>
  <text class="ts" x="502" y="170" text-anchor="middle" style="font-size:9.5px">executor.Decode()，只返回 token id</text>
  <text class="ts" x="502" y="186" text-anchor="middle" style="font-size:9.5px">执行位置由后端决定</text>
  <rect class="box" x="590" y="130" width="155" height="70" rx="6"/>
  <text class="a2" x="667" y="152" text-anchor="middle" style="font-size:11px;font-weight:700">外部采样</text>
  <text class="ts" x="667" y="170" text-anchor="middle" style="font-size:9.5px">DecodeLogits → Sampler</text>
  <text class="ts" x="667" y="186" text-anchor="middle" style="font-size:9.5px">复制 logits 与否看内存可访问性</text>
  <rect class="box" x="425" y="232" width="320" height="42" rx="6"/>
  <text class="t" x="585" y="258" text-anchor="middle" style="font-size:12px;font-weight:700">得到 token id</text>
  <rect class="box" x="425" y="300" width="320" height="64" rx="6"/>
  <text class="t" x="585" y="322" text-anchor="middle" style="font-size:11px;font-weight:700">停止检测 → BPE 解码 → 停止前缀暂存</text>
  <text class="ts" x="585" y="341" text-anchor="middle" style="font-size:9.5px">至少一个候选有文本时：kProcessing 回调</text>
  <text class="ts" x="585" y="356" text-anchor="middle" style="font-size:9.5px">无可发送文本则本轮不回调</text>
  <rect class="hot" x="250" y="305" width="160" height="54" rx="6"/>
  <text class="accent" x="330" y="327" text-anchor="middle" style="font-size:12px;font-weight:700">ShouldStop?</text>
  <text class="ts" x="330" y="346" text-anchor="middle" style="font-size:9.5px">停止序列 / 基准步数 / token 上限</text>
  <rect class="box" x="40" y="305" width="150" height="54" rx="6"/>
  <text class="t" x="115" y="327" text-anchor="middle" style="font-size:11px;font-weight:700">返回最终状态</text>
  <text class="ts" x="115" y="346" text-anchor="middle" style="font-size:9.5px">外层发送最终回调</text>
  <path class="edge" marker-end="url(#a5)" d="M190,92 H248"/>
  <path class="edge" marker-end="url(#a5)" d="M330,119 V138"/>
  <path class="edge" marker-end="url(#a5)" d="M410,92 H502 V128"/>
  <path class="edge" marker-end="url(#a5)" d="M502,92 H667 V128"/>
  <circle class="dot" cx="502" cy="92" r="3"/>
  <path class="edge" marker-end="url(#a5)" d="M502,200 V230"/>
  <path class="edge" marker-end="url(#a5)" d="M667,200 V230"/>
  <path class="edge" marker-end="url(#a5)" d="M585,274 V298"/>
  <path class="edge" marker-end="url(#a5)" d="M425,332 H412"/>
  <path class="edge" marker-end="url(#a5)" d="M250,332 H192"/>
  <text class="ts" x="220" y="323" text-anchor="middle" style="font-size:10px">是</text>
  <path class="loop" marker-end="url(#a5b)" d="M330,359 V405 H18 V92 H38"/>
  <text class="accent" x="180" y="398" text-anchor="middle" style="font-size:10.5px;font-weight:700">否：下一轮重新检查 cancelled</text>
</svg>
