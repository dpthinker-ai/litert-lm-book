<svg viewBox="0 0 780 410" width="780" height="410" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="单候选停止序列在部分匹配、失配和完整命中时的暂存与 id 放行行为">
  <defs>
    <style>
      text { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .b { fill: var(--fig-surface, #f6f8fa); stroke: var(--fig-border, #d0d7de); stroke-width: 1.4; }
      .bl { fill: var(--fig-accent-soft, #e8f0fe); stroke: var(--fig-accent, #0b57d0); stroke-width: 1.5; }
      .t { fill: var(--fig-text, #1f2328); font-size: 14px; font-weight: 700; }
      .tw { fill: var(--fig-accent, #0b57d0); font-size: 12px; font-weight: 700; }
      .ts { fill: var(--fig-text-soft, #57606a); font-size: 11px; }
      .td { fill: var(--fig-text-dim, #8b949e); font-size: 10px; }
      .edge { stroke: var(--fig-accent, #0b57d0); stroke-width: 1.8; fill: none; }
      .edged { stroke: var(--fig-text-dim, #8b949e); stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    </style>
    <marker id="ar" orient="auto-start-reverse" markerWidth="8" markerHeight="8" refX="6" refY="4">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--fig-accent, #0b57d0)"/>
    </marker>
    <marker id="ard" orient="auto-start-reverse" markerWidth="8" markerHeight="8" refX="6" refY="4">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--fig-text-dim, #8b949e)"/>
    </marker>
  </defs>
  <text class="t" x="390" y="25" text-anchor="middle">单候选停止过滤器的 id 暂存时序（停止序列 = [A, B, C]）</text>
  <text class="td" x="390" y="44" text-anchor="middle">过滤器只保存 token id；放行的 id 进入 detokenizer，文本发送时刻还取决于稳定前缀与 Flush</text>
  <text class="tw" x="28" y="82">路径一：收到 X 后失配</text>
  <rect class="bl" x="150" y="94" width="100" height="32" rx="6"/>
  <text class="ts" x="200" y="115" text-anchor="middle">token A</text>
  <rect class="b" x="150" y="160" width="100" height="32" rx="6"/>
  <text class="ts" x="200" y="181" text-anchor="middle">pending [A]</text>
  <text class="td" x="200" y="210" text-anchor="middle">无可发送文本</text>
  <path class="edge" d="M200,126 V156" marker-end="url(#ar)"/>
  <rect class="bl" x="330" y="94" width="100" height="32" rx="6"/>
  <text class="ts" x="380" y="115" text-anchor="middle">token B</text>
  <rect class="b" x="330" y="160" width="100" height="32" rx="6"/>
  <text class="ts" x="380" y="181" text-anchor="middle">pending [A B]</text>
  <text class="td" x="380" y="210" text-anchor="middle">无可发送文本</text>
  <path class="edge" d="M380,126 V156" marker-end="url(#ar)"/>
  <path class="edged" d="M250,176 H326" marker-end="url(#ard)"/>
  <rect class="bl" x="510" y="94" width="100" height="32" rx="6"/>
  <text class="ts" x="560" y="115" text-anchor="middle">token X（失配）</text>
  <rect class="b" x="510" y="160" width="100" height="32" rx="6"/>
  <text class="ts" x="560" y="181" text-anchor="middle">pending [ ]</text>
  <text class="tw" x="560" y="210" text-anchor="middle">放行 id：A B X</text>
  <path class="edge" d="M560,126 V156" marker-end="url(#ar)"/>
  <path class="edged" d="M430,176 H506" marker-end="url(#ard)"/>
  <text class="tw" x="28" y="255">路径二：收到 C 后完整命中</text>
  <rect class="bl" x="150" y="267" width="100" height="32" rx="6"/>
  <text class="ts" x="200" y="288" text-anchor="middle">token A</text>
  <rect class="b" x="150" y="333" width="100" height="32" rx="6"/>
  <text class="ts" x="200" y="354" text-anchor="middle">pending [A]</text>
  <path class="edge" d="M200,299 V329" marker-end="url(#ar)"/>
  <rect class="bl" x="330" y="267" width="100" height="32" rx="6"/>
  <text class="ts" x="380" y="288" text-anchor="middle">token B</text>
  <rect class="b" x="330" y="333" width="100" height="32" rx="6"/>
  <text class="ts" x="380" y="354" text-anchor="middle">pending [A B]</text>
  <path class="edge" d="M380,299 V329" marker-end="url(#ar)"/>
  <path class="edged" d="M250,349 H326" marker-end="url(#ard)"/>
  <rect class="bl" x="510" y="267" width="100" height="32" rx="6"/>
  <text class="ts" x="560" y="288" text-anchor="middle">token C（命中）</text>
  <rect class="b" x="510" y="333" width="100" height="32" rx="6"/>
  <text class="ts" x="560" y="347" text-anchor="middle">追加 C 后命中</text>
  <text class="ts" x="560" y="360" text-anchor="middle">丢弃 A B C</text>
  <path class="edge" d="M560,299 V329" marker-end="url(#ar)"/>
  <path class="edged" d="M430,349 H506" marker-end="url(#ard)"/>
  <text class="tw" x="652" y="288">AllDone = true</text>
  <text class="td" x="652" y="307">（batch = 1）</text>
  <text class="td" x="652" y="326">无 id 放行</text>
  <path class="edged" d="M610,283 H644" marker-end="url(#ard)"/>
  <text class="td" x="390" y="392" text-anchor="middle">多候选时，AllDone 需等待所有候选命中；已命中的候选不再放行 id</text>
</svg>
