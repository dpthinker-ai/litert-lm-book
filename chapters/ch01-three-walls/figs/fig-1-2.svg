<svg viewBox="0 0 720 360" width="720" height="360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="端侧 LLM 的三类约束及带宽侧吞吐示例">
  <defs>
    <style>
      text { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .panel { fill: var(--fig-surface, #f6f8fa); stroke: var(--fig-border, #d0d7de); stroke-width: 1.5; }
      .divider { stroke: var(--fig-border, #d0d7de); stroke-width: 1; }
      .t { fill: var(--fig-text, #1f2328); }
      .ts { fill: var(--fig-text-soft, #57606a); }
      .accent { fill: var(--fig-accent, #0b57d0); }
      .keybox { fill: var(--fig-bg, #ffffff); stroke: var(--fig-accent, #0b57d0); stroke-width: 1.5; }
    </style>
  </defs>
  <text class="t" x="360" y="28" text-anchor="middle" style="font-size:16px;font-weight:700">端侧 LLM 的三类约束</text>
  <g>
    <rect class="panel" x="40" y="62" width="190" height="208" rx="8"/>
    <rect class="panel" x="265" y="62" width="190" height="208" rx="8"/>
    <rect class="panel" x="490" y="62" width="190" height="208" rx="8"/>
    <line class="divider" x1="56" y1="112" x2="214" y2="112"/>
    <line class="divider" x1="281" y1="112" x2="439" y2="112"/>
    <line class="divider" x1="506" y1="112" x2="664" y2="112"/>
  </g>
  <text class="t" x="135" y="94" text-anchor="middle" style="font-size:15px;font-weight:700">① 内存容量约束</text>
  <text class="ts" x="135" y="142" text-anchor="middle" style="font-size:12px">权重 + KV cache</text>
  <text class="ts" x="135" y="162" text-anchor="middle" style="font-size:12px">+ 激活/工作区</text>
  <text class="ts" x="135" y="182" text-anchor="middle" style="font-size:12px">&lt; 进程可用内存</text>
  <text class="ts" x="135" y="218" text-anchor="middle" style="font-size:12px">判断配置是否可行</text>
  <text class="accent" x="135" y="248" text-anchor="middle" style="font-size:12px;font-weight:700">需测后端峰值内存</text>
  <text class="t" x="360" y="94" text-anchor="middle" style="font-size:15px;font-weight:700">② 内存带宽约束</text>
  <text class="ts" x="360" y="142" text-anchor="middle" style="font-size:12px">batch=1 稠密 decode</text>
  <text class="ts" x="360" y="162" text-anchor="middle" style="font-size:12px">每步访问大部分权重</text>
  <text class="ts" x="360" y="182" text-anchor="middle" style="font-size:12px">并读取上下文 K/V</text>
  <text class="ts" x="360" y="218" text-anchor="middle" style="font-size:12px">给出带宽侧上限</text>
  <text class="accent" x="360" y="248" text-anchor="middle" style="font-size:12px;font-weight:700">通常主要受带宽约束</text>
  <text class="t" x="585" y="94" text-anchor="middle" style="font-size:15px;font-weight:700">③ 功耗与异构约束</text>
  <text class="ts" x="585" y="142" text-anchor="middle" style="font-size:12px">持续负载与温控策略</text>
  <text class="ts" x="585" y="162" text-anchor="middle" style="font-size:12px">CPU/GPU/NPU 路径</text>
  <text class="ts" x="585" y="182" text-anchor="middle" style="font-size:12px">随设备和模型而变</text>
  <text class="ts" x="585" y="218" text-anchor="middle" style="font-size:12px">影响持续性能</text>
  <text class="accent" x="585" y="248" text-anchor="middle" style="font-size:12px;font-weight:700">需测吞吐/功率/温度</text>
  <rect class="keybox" x="205" y="294" width="310" height="50" rx="7"/>
  <text class="t" x="360" y="315" text-anchor="middle" style="font-size:12px;font-weight:700">带宽侧上限 = 有效带宽 ÷ 每步字节量</text>
  <text class="accent" x="360" y="335" text-anchor="middle" style="font-size:12px;font-weight:700">示例：50 GB/s ÷ 2 GB/token = 25 tokens/s</text>
</svg>
