<svg xmlns="http://www.w3.org/2000/svg" width="840" height="366" viewBox="0 0 840 366" role="img" aria-label="图 10-2 Gemma 4 的 128 选 8 路由在单 token、集中分派和分散分派下的专家工作集核算">
<defs><style>
.bg{fill:var(--fig-bg,#ffffff)} .box{fill:var(--fig-surface,#f3f6fb);stroke:var(--fig-border,#cdd7e5);stroke-width:1.4} .hi{fill:var(--fig-surface-2,#e7f0ff);stroke:var(--fig-accent,#0b57d0);stroke-width:1.6} text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;font-size:16px;fill:var(--fig-text,#1f2328)} .small{font-size:14px;fill:var(--fig-text-soft,#526174)} .title{font-size:20px;font-weight:600} .value{font-size:19px;font-weight:600;fill:var(--fig-accent,#0b57d0)}
</style></defs>
<rect class="bg" width="840" height="366"/>
<text x="24" y="33" class="title">Gemma 4：128 个路由专家，每个 token 选 8 个</text>
<rect x="24" y="58" width="252" height="248" rx="8" class="box"/>
<text x="38" y="87">单 token</text>
<text x="38" y="121">8 条分派，U = 8</text>
<text x="38" y="151">8 个专家各收到 1 行</text>
<text x="38" y="177" class="small">其余 120 个专家没有输入</text>
<text x="38" y="217">唯一权重：0.02216 GiB</text>
<text x="38" y="261" class="value">4 FLOPs/byte</text>
<text x="38" y="287" class="small">路由专家权重项</text>
<rect x="294" y="58" width="252" height="248" rx="8" class="hi"/>
<text x="308" y="87">16 个 token：集中分派</text>
<text x="308" y="121">128 条分派，U = 8</text>
<text x="308" y="151">同 8 个专家各收到 16 行</text>
<text x="308" y="177" class="small">其余 120 个专家没有输入</text>
<text x="308" y="217">唯一权重：0.02216 GiB</text>
<text x="308" y="261" class="value">64 FLOPs/byte</text>
<text x="308" y="287" class="small">路由专家权重项</text>
<rect x="564" y="58" width="252" height="248" rx="8" class="box"/>
<text x="578" y="87">16 个 token：分散分派</text>
<text x="578" y="121">128 条分派，U = 128</text>
<text x="578" y="151">128 个专家各收到 1 行</text>
<text x="578" y="177" class="small">各 token 的专家集合不重叠</text>
<text x="578" y="217">唯一权重：0.35449 GiB</text>
<text x="578" y="261" class="value">4 FLOPs/byte</text>
<text x="578" y="287" class="small">路由专家权重项</text>
<text x="24" y="333" class="small">按理想 INT4、路由专家权重各读一次核算；不含共享分支、注意力和其他读写。</text>
<text x="24" y="356" class="small">集中与分散均为人工指定的分布，不是 Gemma 4 的实测路由序列。</text>
</svg>
