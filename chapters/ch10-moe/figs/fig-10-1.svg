<svg viewBox="0 0 900 340" width="900" height="340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="两个 token 的 4 条分派按专家分段，专家 2 一次处理两行，输出按记录中的 token 位置与路由系数累加回各自的行">
  <defs>
    <style>
      text { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .title { fill: var(--fig-text, #1f2328); font-size: 15px; font-weight: 700; }
      .head { fill: var(--fig-accent, #0b57d0); font-size: 12px; font-weight: 700; }
      .label { fill: var(--fig-text, #1f2328); font-size: 11.5px; font-weight: 700; }
      .soft { fill: var(--fig-text-soft, #57606a); font-size: 10.5px; }
      .dim { fill: var(--fig-text-dim, #8b949e); font-size: 10px; }
      .a2 { fill: var(--fig-accent-2, #6639ba); font-size: 10.5px; font-weight: 700; }
      .box { fill: var(--fig-surface, #f6f8fa); stroke: var(--fig-border, #d0d7de); stroke-width: 1.4; }
      .active { fill: var(--fig-bg, #ffffff); stroke: var(--fig-accent, #0b57d0); stroke-width: 1.7; }
      .edge { stroke: var(--fig-accent, #0b57d0); stroke-width: 1.6; fill: none; }
      .edge2 { stroke: var(--fig-accent-2, #6639ba); stroke-width: 1.6; fill: none; }
      .edge-dim { stroke: var(--fig-text-dim, #8b949e); stroke-width: 1.3; fill: none; }
    </style>
    <marker id="f101-a" orient="auto" markerWidth="8" markerHeight="8" refX="7" refY="4"><path d="M0,0 L8,4 L0,8 z" fill="var(--fig-accent, #0b57d0)"/></marker>
    <marker id="f101-a2" orient="auto" markerWidth="8" markerHeight="8" refX="7" refY="4"><path d="M0,0 L8,4 L0,8 z" fill="var(--fig-accent-2, #6639ba)"/></marker>
    <marker id="f101-d" orient="auto" markerWidth="8" markerHeight="8" refX="7" refY="4"><path d="M0,0 L8,4 L0,8 z" fill="var(--fig-text-dim, #8b949e)"/></marker>
  </defs>
  <text class="title" x="450" y="26" text-anchor="middle">两个 token 经过一个 MoE 专家层：按专家汇集输入，按记录合并输出</text>
  <text class="head" x="28" y="56">① 路由结果（算子输入）</text>
  <rect class="box" x="28" y="72" width="180" height="44" rx="6"/>
  <text class="label" x="38" y="90">x₀（token 0）</text>
  <text class="soft" x="38" y="107">选 e0、e2；系数 α₀₀、α₀₂</text>
  <rect class="box" x="28" y="128" width="180" height="44" rx="6"/>
  <text class="label" x="38" y="146">x₁（token 1）</text>
  <text class="soft" x="38" y="163">选 e2、e1；系数 α₁₂、α₁₁</text>
  <text class="soft" x="28" y="200">每个 (token, route) 是一条分派</text>
  <text class="soft" x="28" y="217">共 T·K = 2 × 2 = 4 条</text>
  <path class="edge-dim" d="M208,122 H243" marker-end="url(#f101-d)"/>
  <text class="head" x="248" y="56">② 分派记录（按专家分段）</text>
  <rect class="box" x="248" y="72" width="180" height="44" rx="6"/>
  <text class="label" x="258" y="90">e0 段：1 条</text>
  <text class="soft" x="258" y="107">(t0, route 0)</text>
  <rect class="box" x="248" y="128" width="180" height="44" rx="6"/>
  <text class="label" x="258" y="146">e1 段：1 条</text>
  <text class="soft" x="258" y="163">(t1, route 1)</text>
  <rect class="active" x="248" y="184" width="180" height="58" rx="6"/>
  <text class="label" x="258" y="202">e2 段：2 条</text>
  <text class="soft" x="258" y="218">(t0, route 1)</text>
  <text class="soft" x="258" y="233">(t1, route 0)</text>
  <text class="soft" x="248" y="266">计数 [1, 1, 2] → 前缀和</text>
  <text class="soft" x="248" y="283">偏移 [0, 1, 2, 4]，按偏移填入</text>
  <path class="edge" d="M428,94 H463" marker-end="url(#f101-a)"/>
  <path class="edge" d="M428,150 H463" marker-end="url(#f101-a)"/>
  <path class="edge" d="M428,213 H463" marker-end="url(#f101-a)"/>
  <text class="head" x="468" y="56">③ 逐专家计算</text>
  <rect class="box" x="468" y="72" width="180" height="44" rx="6"/>
  <text class="label" x="478" y="90">e0：汇集 [x₀]</text>
  <text class="soft" x="478" y="107">gate/up → φ ⊙ → down，1 行</text>
  <rect class="box" x="468" y="128" width="180" height="44" rx="6"/>
  <text class="label" x="478" y="146">e1：汇集 [x₁]</text>
  <text class="soft" x="478" y="163">同上，1 行</text>
  <rect class="active" x="468" y="184" width="180" height="58" rx="6"/>
  <text class="label" x="478" y="202">e2：汇集 [x₀; x₁]</text>
  <text class="soft" x="478" y="218">权重准备一次，处理 2 行</text>
  <text class="soft" x="478" y="233">得到 f₂(x₀)、f₂(x₁)</text>
  <text class="soft" x="468" y="266">无输入的专家整段跳过</text>
  <path class="edge" d="M648,94 H683" marker-end="url(#f101-a)"/>
  <path class="edge" d="M648,150 H683" marker-end="url(#f101-a)"/>
  <path class="edge2" d="M648,206 C668,206 664,100 683,100" marker-end="url(#f101-a2)"/>
  <path class="edge2" d="M648,222 C668,222 664,154 683,154" marker-end="url(#f101-a2)"/>
  <text class="a2" x="666" y="258" text-anchor="middle">2 行分别回到 y₀、y₁</text>
  <text class="head" x="688" y="56">④ 按记录加权累加</text>
  <rect class="box" x="688" y="72" width="184" height="44" rx="6"/>
  <text class="label" x="698" y="90">y₀（输出第 0 行）</text>
  <text class="soft" x="698" y="107">α₀₀ f₀(x₀) + α₀₂ f₂(x₀)</text>
  <rect class="box" x="688" y="128" width="184" height="44" rx="6"/>
  <text class="label" x="698" y="146">y₁（输出第 1 行）</text>
  <text class="soft" x="698" y="163">α₁₂ f₂(x₁) + α₁₁ f₁(x₁)</text>
  <text class="soft" x="688" y="200">输出先清零，各专家结果按</text>
  <text class="soft" x="688" y="217">记录中的 token 位置累加</text>
  <text class="dim" x="450" y="308" text-anchor="middle">E = 3、K = 2、T = 2：4 条分派，3 个专家都有输入。只记专家编号而不记 token 位置时，f₂ 的两行无法回到正确的输出行。</text>
  <text class="dim" x="450" y="326" text-anchor="middle">每个专家内部的 gate/up 投影、激活 φ、逐元素乘 ⊙ 与 down 投影对应 10.2 节的公式。</text>
</svg>
