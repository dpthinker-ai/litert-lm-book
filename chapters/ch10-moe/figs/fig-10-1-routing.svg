<svg xmlns="http://www.w3.org/2000/svg" width="840" height="395" viewBox="0 0 840 395" role="img" aria-label="图 10-1 小型算子示例中两个 token 的专家选择、按专家分派与加权合并">
<defs><style>
.bg{fill:var(--fig-bg,#ffffff)} .box{fill:var(--fig-surface,#f3f6fb);stroke:var(--fig-border,#cdd7e5);stroke-width:1.4} .hi{fill:var(--fig-surface-2,#e7f0ff);stroke:var(--fig-accent,#0b57d0);stroke-width:1.6} .wait{fill:var(--fig-surface-2,#fff0db);stroke:var(--fig-accent-2,#b56a00);stroke-width:1.4} text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;font-size:16px;fill:var(--fig-text,#1f2328)} .small{font-size:14px;fill:var(--fig-text-soft,#526174)} .title{font-size:20px;font-weight:600} .line{fill:none;stroke:var(--fig-accent,#0b57d0);stroke-width:1.6;marker-end:url(#arrow)}
</style><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#0b57d0"/></marker></defs><rect class="bg" width="840" height="395"/>
<text x="24" y="33" class="title">同一专家收到的输入行可以一起计算</text>
