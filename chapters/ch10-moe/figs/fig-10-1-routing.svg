<text x="38" y="91" class="">路由器 + Top-k</text>
<text x="38" y="114" class="">t0 → e0、e2</text>
<text x="38" y="137" class="">t1 → e2、e1</text>
<rect x="290" y="64" width="220" height="69" rx="8" class="box"/>
<text x="304" y="91" class="">分派记录</text>
<text x="304" y="114" class="">保存 token 与 route 位置</text>
<path class="line" d="M234,109 L286,109"/>
<rect x="574" y="57" width="240" height="46" rx="8" class="box"/>
<text x="588" y="84" class="">e0：计算 x0</text>
<rect x="574" y="117" width="240" height="46" rx="8" class="box"/>
<text x="588" y="144" class="">e1：计算 x1</text>
<rect x="574" y="177" width="240" height="46" rx="8" class="hi"/>
<text x="588" y="204" class="">e2：计算 [x0; x1]</text>
<path class="line" d="M510,91 L570,80"/>
