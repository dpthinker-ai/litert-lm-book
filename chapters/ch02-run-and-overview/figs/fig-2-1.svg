<svg viewBox="0 0 640 380" width="640" height="380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Roofline 的计算侧与带宽侧上限，以及条件性工作点">
  <defs>
    <style>
      text { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .axis { stroke: var(--fig-text, #1f2328); stroke-width: 1.5; }
      .grid { stroke: var(--fig-border-2, #e6eaef); stroke-width: 1; }
      .roof { stroke: var(--fig-accent, #0b57d0); stroke-width: 2.5; fill: none; }
      .t  { fill: var(--fig-text, #1f2328); }
      .ts { fill: var(--fig-text-soft, #57606a); }
      .dot { fill: var(--fig-accent-2, #6639ba); }
    </style>
  </defs>
  <text class="t" x="320" y="26" text-anchor="middle" style="font-size:15px;font-weight:700">Roofline：计算侧与带宽侧上限</text>
  <!-- 坐标轴 -->
  <line class="axis" x1="70" y1="320" x2="600" y2="320"/>
  <line class="axis" x1="70" y1="320" x2="70" y2="60"/>
  <text class="ts" x="335" y="360" text-anchor="middle" style="font-size:12px">算术强度（每读一字节摊上多少次计算）→</text>
  <text class="ts" x="24" y="190" text-anchor="middle" style="font-size:12px" transform="rotate(-90 24 190)">性能上限 →</text>
  <!-- Roofline：低算术强度处受带宽侧上限约束，高强度处受计算侧上限约束 -->
  <path class="roof" d="M70,300 L300,110 L600,110"/>
  <text class="ts" x="470" y="100" text-anchor="middle" style="font-size:11px">计算侧上限</text>
  <text class="ts" x="150" y="180" text-anchor="middle" style="font-size:11px" transform="rotate(-39 150 180)">带宽侧上限</text>
  <!-- 拐点 -->
  <line class="grid" x1="300" y1="110" x2="300" y2="320"/>
  <text class="ts" x="300" y="336" text-anchor="middle" style="font-size:10px">拐点</text>
  <text class="ts" x="568" y="302" text-anchor="end" style="font-size:10px">工作点仅作示意</text>
  <!-- batch=1 稠密 decode 的常见低强度工作点 -->
  <circle class="dot" cx="130" cy="250" r="6"/>
  <text class="t" x="130" y="238" text-anchor="middle" style="font-size:12px;font-weight:700">batch=1 稠密 decode</text>
  <text class="ts" x="130" y="278" text-anchor="middle" style="font-size:10px">常见低算术强度</text>
  <text class="ts" x="130" y="291" text-anchor="middle" style="font-size:10px">位置需按实现确认</text>
  <!-- 较长 prefill 的常见高强度工作点 -->
  <circle class="dot" cx="470" cy="110" r="6"/>
  <text class="t" x="470" y="140" text-anchor="middle" style="font-size:12px;font-weight:700">较长 prefill</text>
  <text class="ts" x="470" y="158" text-anchor="middle" style="font-size:10px">权重可在序列维度复用</text>
  <text class="ts" x="470" y="171" text-anchor="middle" style="font-size:10px">位置需按实现确认</text>
</svg>
