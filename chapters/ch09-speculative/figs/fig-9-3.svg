<svg viewBox="0 0 760 430" width="760" height="430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="停止 token 位于 4-token 批次下标 1 时，任务层逐 token 检测并将逻辑位置回退 3">
  <defs>
    <style>
      text { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .title { fill: var(--fig-text, #1f2328); font-size: 16px; font-weight: 700; }
      .label { fill: var(--fig-text, #1f2328); font-size: 12px; font-weight: 700; }
      .soft { fill: var(--fig-text-soft, #57606a); font-size: 11px; }
      .dim { fill: var(--fig-text-dim, #8b949e); font-size: 10px; }
      .blue { fill: var(--fig-accent, #0b57d0); font-size: 11px; font-weight: 700; }
      .token { fill: var(--fig-surface, #f6f8fa); stroke: var(--fig-border, #d0d7de); stroke-width: 1.4; }
      .keep { fill: var(--fig-accent-soft, #e8f0fe); stroke: var(--fig-accent, #0b57d0); stroke-width: 1.6; }
      .stop { fill: #fff1f0; stroke: #cf222e; stroke-width: 1.6; }
      .drop { fill: var(--fig-surface-2, #eef1f5); stroke: var(--fig-text-dim, #8b949e); stroke-width: 1.3; stroke-dasharray: 4 3; }
      .edge { stroke: var(--fig-accent, #0b57d0); stroke-width: 1.6; fill: none; }
      .rollback { stroke: #cf222e; stroke-width: 1.6; stroke-dasharray: 5 4; fill: none; }
      .rule { stroke: var(--fig-border, #d0d7de); stroke-width: 1; }
    </style>
    <marker id="arrow93" orient="auto" markerWidth="8" markerHeight="8" refX="7" refY="4"><path d="M0,0 L8,4 L0,8 z" fill="var(--fig-accent, #0b57d0)"/></marker>
    <marker id="arrow93r" orient="auto" markerWidth="8" markerHeight="8" refX="7" refY="4"><path d="M0,0 L8,4 L0,8 z" fill="#cf222e"/></marker>
  </defs>
  <text class="title" x="380" y="28" text-anchor="middle">多 token 返回后的顺序处理与批内回退</text>
  <text class="blue" x="34" y="66">① executor 一次返回长度为 4 的序列</text>
  <rect class="keep" x="80" y="88" width="112" height="48" rx="7"/>
  <text class="label" x="136" y="117" text-anchor="middle">token 0</text>
  <rect class="stop" x="232" y="88" width="112" height="48" rx="7"/>
  <text class="label" x="288" y="109" text-anchor="middle">token 1</text>
  <text x="288" y="127" text-anchor="middle" fill="#cf222e" style="font-size:10px;font-weight:700">停止序列命中</text>
  <rect class="drop" x="384" y="88" width="112" height="48" rx="7"/>
  <text class="label" x="440" y="117" text-anchor="middle">token 2</text>
  <rect class="drop" x="536" y="88" width="112" height="48" rx="7"/>
  <text class="label" x="592" y="117" text-anchor="middle">token 3</text>
  <path class="edge" d="M192,112 H224" marker-end="url(#arrow93)"/>
  <path class="edge" d="M344,112 H376" marker-end="url(#arrow93)"/>
  <path class="edge" d="M496,112 H528" marker-end="url(#arrow93)"/>
  <text class="blue" x="34" y="174">② DecodeOneStep 按位置推进停止检测与 BPE 合并</text>
  <rect class="token" x="80" y="194" width="568" height="54" rx="7"/>
  <text class="soft" x="364" y="216" text-anchor="middle">ProcessTokens(token 0) → MergeTokenIds → 解码并暂存可见文本</text>
  <text class="soft" x="364" y="238" text-anchor="middle">ProcessTokens(token 1) → BPE 合并与文本解码 → AllDone = true</text>
  <path class="rollback" d="M592,258 C592,294 288,294 288,258" marker-end="url(#arrow93r)"/>
  <text x="440" y="286" text-anchor="middle" fill="#cf222e" style="font-size:11px;font-weight:700">diff = 4 - 1 = 3</text>
  <text class="blue" x="34" y="326">③ 调整逻辑位置；启用 streaming 时产生一次更新</text>
  <rect class="keep" x="80" y="346" width="250" height="52" rx="7"/>
  <text class="label" x="205" y="368" text-anchor="middle">保留 token 0</text>
  <text class="soft" x="205" y="387" text-anchor="middle">回调可携带一个或多个可见 token</text>
  <path class="edge" d="M330,372 H402" marker-end="url(#arrow93)"/>
  <rect class="token" x="410" y="346" width="238" height="52" rx="7"/>
  <text class="label" x="529" y="368" text-anchor="middle">SetCurrentStep(current - 3)</text>
  <text class="soft" x="529" y="387" text-anchor="middle">停止 token 与后续位置均不采用</text>
  <line class="rule" x1="34" y1="414" x2="726" y2="414"/>
  <text class="dim" x="380" y="427" text-anchor="middle">本例命中下标 1；命中批次末位时，代码不调用 SetCurrentStep</text>
</svg>
