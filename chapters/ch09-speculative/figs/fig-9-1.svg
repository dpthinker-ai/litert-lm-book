<svg viewBox="0 0 680 340" width="680" height="340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一次 Draft 调用的草拟验证与接受流程">
  <defs>
  <style>
    text { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .t  { fill: var(--fig-text, #1f2328); }
    .ts { fill: var(--fig-text-soft, #57606a); }
    .accent { fill: var(--fig-accent, #0b57d0); }
    .a2 { fill: var(--fig-accent-2, #6639ba); }
    .draft { fill: var(--fig-surface, #f6f8fa); stroke: var(--fig-border, #d0d7de); stroke-width: 1.4; }
    .base  { fill: var(--fig-bg, #fff); stroke: var(--fig-accent, #0b57d0); stroke-width: 1.8; }
    .ok    { fill: var(--fig-bg, #fff); stroke: var(--fig-green, #1a7f37); stroke-width: 1.6; }
    .bonus { fill: var(--fig-bg, #fff); stroke: var(--fig-accent-2, #6639ba); stroke-width: 1.6; }
    .bad   { fill: var(--fig-surface-2, #eef1f5); stroke: var(--fig-text-dim, #8b949e); stroke-width: 1.2; stroke-dasharray: 3 2; }
    .edge  { stroke: var(--fig-text-soft, #57606a); stroke-width: 1.4; fill: none; }
  </style>
  <marker id="a9" orient="auto" markerWidth="8" markerHeight="8" refX="6" refY="3.5"><path d="M0,0 L7,3.5 L0,7 z" fill="var(--fig-text-soft, #57606a)"/></marker>
  </defs>
  <text class="t" x="340" y="26" text-anchor="middle" style="font-size:15px;font-weight:700">一次 Draft 调用：base 执行一次 verify</text>
  <!-- 第一步：drafter 草拟 G 个 -->
  <text class="accent" x="40" y="70" style="font-size:12px;font-weight:700">① drafter 串行草拟 G 个 token</text>
  <g>
    <rect class="draft" x="60"  y="82" width="50" height="34" rx="5"/><text class="t" x="85"  y="104" text-anchor="middle" style="font-size:11px">d₁</text>
    <rect class="draft" x="122" y="82" width="50" height="34" rx="5"/><text class="t" x="147" y="104" text-anchor="middle" style="font-size:11px">d₂</text>
    <rect class="draft" x="184" y="82" width="50" height="34" rx="5"/><text class="t" x="209" y="104" text-anchor="middle" style="font-size:11px">d₃</text>
    <path class="edge" marker-end="url(#a9)" d="M110,99 H121"/>
    <path class="edge" marker-end="url(#a9)" d="M172,99 H183"/>
  </g>
  <!-- 第二步：base 一次 verify -->
  <text class="accent" x="40" y="158" style="font-size:12px;font-weight:700">② base 模型一次前向验证 G+1 个位置</text>
  <rect class="base" x="60" y="170" width="420" height="40" rx="6"/>
  <text class="accent" x="270" y="195" text-anchor="middle" style="font-size:12px;font-weight:700">base.verify signature：一次 RunAsync</text>
  <!-- 第三步：接受前缀 + bonus -->
  <text class="a2" x="40" y="250" style="font-size:12px;font-weight:700">③ 接受最长匹配前缀 + 1 个 bonus token</text>
  <g>
    <rect class="ok"    x="60"  y="262" width="50" height="34" rx="5"/><text class="t" x="85"  y="284" text-anchor="middle" style="font-size:11px">✓ d₁</text>
    <rect class="ok"    x="122" y="262" width="50" height="34" rx="5"/><text class="t" x="147" y="284" text-anchor="middle" style="font-size:11px">✓ d₂</text>
    <rect class="bad"   x="184" y="262" width="50" height="34" rx="5"/><text class="ts" x="209" y="284" text-anchor="middle" style="font-size:10px">✗ 丢</text>
    <rect class="bonus" x="246" y="262" width="70" height="34" rx="5"/><text class="a2" x="281" y="284" text-anchor="middle" style="font-size:10.5px;font-weight:700">bonus</text>
  </g>
  <text class="ts" x="360" y="284" style="font-size:11px">首个不匹配处取 base 正确答案；全对则额外获得第 G+1 个</text>
  <text class="ts" x="340" y="322" text-anchor="middle" style="font-size:11px;font-weight:700">Draft 返回 K+1 个 token（0 ≤ K ≤ G）；端到端收益还取决于轮次成本</text>
</svg>
