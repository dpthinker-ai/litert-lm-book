<svg viewBox="0 0 720 360" width="720" height="360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label=".litertlm 头部与 section 布局">
  <defs>
    <style>
      text { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .hdr { fill: var(--fig-bg, #fff); stroke: var(--fig-accent, #0b57d0); stroke-width: 1.8; }
      .sec { fill: var(--fig-surface, #f6f8fa); stroke: var(--fig-border, #d0d7de); stroke-width: 1.5; }
      .meta { fill: var(--fig-accent-soft, #e8f0fe); stroke: var(--fig-accent, #0b57d0); stroke-width: 1.5; }
      .t { fill: var(--fig-text, #1f2328); }
      .ts { fill: var(--fig-text-soft, #57606a); }
      .accent { fill: var(--fig-accent, #0b57d0); }
      .edge { stroke: var(--fig-text-dim, #8b949e); stroke-width: 1.2; fill: none; stroke-dasharray: 3 3; }
    </style>
  </defs>
  <text class="t" x="360" y="27" text-anchor="middle" style="font-size:15px;font-weight:700">一个 .litertlm 文件：头部 + section 数据</text>
  <g>
    <rect class="hdr" x="190" y="52" width="300" height="54" rx="5"/>
    <text class="accent" x="340" y="73" text-anchor="middle" style="font-size:12px;font-weight:700">FlatBuffer 头部</text>
    <text class="ts" x="340" y="91" text-anchor="middle" style="font-size:10.5px">版本、系统元数据、SectionObject 目录</text>
    <rect class="sec" x="190" y="114" width="300" height="48" rx="5"/>
    <text class="t" x="340" y="135" text-anchor="middle" style="font-size:11.5px;font-weight:700">TFLiteModel / TFLiteWeights</text>
    <text class="ts" x="340" y="151" text-anchor="middle" style="font-size:10px">权重表示由模型产物与后端约定决定</text>
    <rect class="sec" x="190" y="170" width="300" height="42" rx="5"/>
    <text class="t" x="340" y="195" text-anchor="middle" style="font-size:11px">SP_Tokenizer / HF_Tokenizer_Zlib</text>
    <rect class="meta" x="190" y="220" width="300" height="64" rx="5"/>
    <text class="t" x="340" y="241" text-anchor="middle" style="font-size:11.5px;font-weight:700">LlmMetadataProto</text>
    <text class="ts" x="340" y="259" text-anchor="middle" style="font-size:10px">start / stop token、prompt 模板、采样参数</text>
    <text class="ts" x="340" y="275" text-anchor="middle" style="font-size:10px">以及 LlmModelType</text>
    <rect class="sec" x="190" y="292" width="300" height="34" rx="5"/>
    <text class="t" x="340" y="314" text-anchor="middle" style="font-size:10.5px">GenericBinaryData 等可选 section</text>
  </g>
  <text class="accent" x="50" y="125" style="font-size:11px;font-weight:700">SectionObject</text>
  <text class="ts" x="50" y="145" style="font-size:10px">data_type</text>
  <text class="ts" x="50" y="162" style="font-size:10px">begin_offset</text>
  <text class="ts" x="50" y="179" style="font-size:10px">end_offset</text>
  <text class="ts" x="50" y="196" style="font-size:10px">items（可选键值）</text>
  <path class="edge" d="M158,161 H188"/>
  <text class="accent" x="522" y="124" style="font-size:11px;font-weight:700">结构边界</text>
  <text class="ts" x="522" y="145" style="font-size:10px">键名是字符串，可扩展</text>
  <text class="ts" x="522" y="162" style="font-size:10px">值限定为 VData union 类型</text>
  <text class="ts" x="522" y="179" style="font-size:10px">后续 section 从 16 KiB 边界开始</text>
  <path class="edge" d="M492,161 H516"/>
  <text class="ts" x="522" y="215" style="font-size:10px">投机解码支持并非独立段：</text>
  <text class="ts" x="522" y="232" style="font-size:10px">代码检查 TFLiteModel 的</text>
  <text class="ts" x="522" y="249" style="font-size:10px">model_type section item</text>
  <path class="edge" d="M492,138 H506 V215 H516"/>
  <text class="ts" x="360" y="343" text-anchor="middle" style="font-size:10.5px">头部给出目录；当前 loader 先记录范围</text>
  <text class="ts" x="360" y="354" text-anchor="middle" style="font-size:10.5px">调用方请求数据时，再取得相应 section buffer</text>
</svg>
