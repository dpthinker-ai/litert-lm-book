<svg viewBox="0 0 920 520" width="920" height="520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="从固定前缀到后端编译的六层容器校验阶梯，以及每层对应的失败边界">
  <defs>
    <style>
      text { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .step { fill: var(--fig-surface, #f6f8fa); stroke: var(--fig-border, #d0d7de); stroke-width: 1.5; }
      .active { fill: var(--fig-accent-soft, #e8f0fe); stroke: var(--fig-accent, #0b57d0); stroke-width: 1.7; }
      .warn { fill: var(--fig-warning-panel, #fff4ce); stroke: var(--fig-warn, #9a6700); stroke-width: 1.3; }
      .title { fill: var(--fig-text, #1f2328); font-size: 15px; font-weight: 700; }
      .head { fill: var(--fig-accent, #0b57d0); font-size: 11.5px; font-weight: 700; }
      .body { fill: var(--fig-text-soft, #57606a); font-size: 9.8px; }
      .fail { fill: var(--fig-bg, #ffffff); font-size: 9.4px; font-weight: 700; }
      .warnbody { fill: var(--fig-bg, #ffffff); font-size: 9.8px; }
      .small { fill: var(--fig-text-dim, #8b949e); font-size: 9.2px; }
      .edge { stroke: var(--fig-accent, #0b57d0); stroke-width: 1.8; fill: none; }
      .fail-edge { stroke: var(--fig-warn, #9a6700); stroke-width: 1.2; fill: none; stroke-dasharray: 4 4; }
    </style>
    <marker id="f75-arrow" orient="auto" markerWidth="8" markerHeight="8" refX="7" refY="4">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--fig-accent, #0b57d0)"/>
    </marker>
    <marker id="f75-arrow-warn" orient="auto" markerWidth="8" markerHeight="8" refX="7" refY="4">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--fig-warn, #9a6700)"/>
    </marker>
  </defs>
  <text class="title" x="460" y="27" text-anchor="middle">容器分层校验：每一层只回答一种问题</text>
  <rect class="active" x="25" y="302" width="132" height="76" rx="7"/>
  <text class="head" x="91" y="326" text-anchor="middle">1　固定前缀</text>
  <text class="body" x="91" y="348" text-anchor="middle">magic 与主版本号</text>
  <text class="body" x="91" y="365" text-anchor="middle">先确认文件类型</text>
  <rect class="step" x="173" y="250" width="132" height="76" rx="7"/>
  <text class="head" x="239" y="274" text-anchor="middle">2　FlatBuffer 头</text>
  <text class="body" x="239" y="296" text-anchor="middle">header end 与 verifier</text>
  <text class="body" x="239" y="313" text-anchor="middle">确认头部结构完整</text>
  <rect class="step" x="321" y="198" width="132" height="76" rx="7"/>
  <text class="head" x="387" y="222" text-anchor="middle">3　section 目录</text>
  <text class="body" x="387" y="244" text-anchor="middle">范围、重叠与重复键</text>
  <text class="body" x="387" y="261" text-anchor="middle">确认索引一致</text>
  <rect class="step" x="469" y="146" width="132" height="76" rx="7"/>
  <text class="head" x="535" y="170" text-anchor="middle">4　payload</text>
  <text class="body" x="535" y="192" text-anchor="middle">TFLite、tokenizer、metadata</text>
  <text class="body" x="535" y="209" text-anchor="middle">确认子格式可读</text>
  <rect class="step" x="617" y="94" width="132" height="76" rx="7"/>
  <text class="head" x="683" y="118" text-anchor="middle">5　Engine 语义</text>
  <text class="body" x="683" y="140" text-anchor="middle">资源角色与 backend 约束</text>
  <text class="body" x="683" y="157" text-anchor="middle">确认组合可执行</text>
  <rect class="active" x="765" y="42" width="132" height="76" rx="7"/>
  <text class="head" x="831" y="66" text-anchor="middle">6　后端编译</text>
  <text class="body" x="831" y="88" text-anchor="middle">算子、精度与设备能力</text>
  <text class="body" x="831" y="105" text-anchor="middle">确认目标设备可运行</text>
  <path class="edge" d="M158,320 H165 V288 H167" marker-end="url(#f75-arrow)"/>
  <path class="edge" d="M306,268 H313 V236 H315" marker-end="url(#f75-arrow)"/>
  <path class="edge" d="M454,216 H461 V184 H463" marker-end="url(#f75-arrow)"/>
  <path class="edge" d="M602,164 H609 V132 H611" marker-end="url(#f75-arrow)"/>
  <path class="edge" d="M750,112 H757 V80 H759" marker-end="url(#f75-arrow)"/>
  <text class="small" x="24" y="409">失败边界</text>
  <rect class="warn" x="25" y="423" width="132" height="62" rx="6"/>
  <text class="fail" x="91" y="446" text-anchor="middle">非 .litertlm 文件</text>
  <text class="warnbody" x="91" y="466" text-anchor="middle">或主版本不兼容</text>
  <rect class="warn" x="173" y="423" width="132" height="62" rx="6"/>
  <text class="fail" x="239" y="446" text-anchor="middle">头部范围越界</text>
  <text class="warnbody" x="239" y="466" text-anchor="middle">或 verifier 不通过</text>
  <rect class="warn" x="321" y="423" width="132" height="62" rx="6"/>
  <text class="fail" x="387" y="446" text-anchor="middle">offset 反向或越界</text>
  <text class="warnbody" x="387" y="466" text-anchor="middle">目录键冲突或相互重叠</text>
  <rect class="warn" x="469" y="423" width="132" height="62" rx="6"/>
  <text class="fail" x="535" y="446" text-anchor="middle">子格式损坏</text>
  <text class="warnbody" x="535" y="466" text-anchor="middle">或声明类型不匹配</text>
  <rect class="warn" x="617" y="423" width="132" height="62" rx="6"/>
  <text class="fail" x="683" y="446" text-anchor="middle">必需资源缺失</text>
  <text class="warnbody" x="683" y="466" text-anchor="middle">或后端约束不一致</text>
  <rect class="warn" x="765" y="423" width="132" height="62" rx="6"/>
  <text class="fail" x="831" y="446" text-anchor="middle">编译失败</text>
  <text class="warnbody" x="831" y="466" text-anchor="middle">算子或设备不支持</text>
  <path class="fail-edge" d="M91,380 V416" marker-end="url(#f75-arrow-warn)"/>
  <path class="fail-edge" d="M239,328 V416" marker-end="url(#f75-arrow-warn)"/>
  <path class="fail-edge" d="M387,276 V416" marker-end="url(#f75-arrow-warn)"/>
  <path class="fail-edge" d="M535,224 V416" marker-end="url(#f75-arrow-warn)"/>
  <path class="fail-edge" d="M683,172 V416" marker-end="url(#f75-arrow-warn)"/>
  <path class="fail-edge" d="M831,120 V416" marker-end="url(#f75-arrow-warn)"/>
  <text class="small" x="460" y="508" text-anchor="middle">任一层失败即停止继续处理，并记录发生失败的层级；上层通过不代表下层成立</text>
</svg>
